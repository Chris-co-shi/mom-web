name: Remove temporary S08 branch

on:
  push:
    branches:
      - phase/p1.5-auth-authorization

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          ref: phase/p1.5-auth-authorization
          fetch-depth: 1

      - name: Delete temporary branch and self-remove
        run: |
          git push origin --delete fix/p15-s08-main-ci || true
          git rm .github/workflows/p15-s08-remove-temp-branch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(governance): remove temporary S08 cleanup workflow"
          git push origin HEAD:phase/p1.5-auth-authorization
