name: P1.5 S08 exact source fix

on:
  push:
    branches:
      - fix/p15-s08-main-ci

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/p15-s08-main-ci
          fetch-depth: 1

      - name: Apply ArrayBuffer-backed JWT byte fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/auth/src/index.ts')
          source = path.read_text(encoding='utf-8')
          old = """function base64UrlBytes(value: string): Uint8Array {
            const padded = value.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(value.length / 4) * 4, '=');
            const binary = atob(padded);
            return Uint8Array.from(binary, (character) => character.charCodeAt(0));
          }
          """
          new = """function base64UrlBytes(value: string): Uint8Array<ArrayBuffer> {
            const padded = value.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(value.length / 4) * 4, '=');
            const binary = atob(padded);
            const bytes = new Uint8Array(new ArrayBuffer(binary.length));
            for (let index = 0; index < binary.length; index += 1) {
              bytes[index] = binary.charCodeAt(index);
            }
            return bytes;
          }
          """
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one original base64UrlBytes implementation')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Commit exact fix and remove temporary workflow
        run: |
          git rm .github/workflows/p15-s08-exact-source-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/auth/src/index.ts
          git commit -m "fix(auth): use ArrayBuffer-backed JWT bytes"
          git push origin HEAD:fix/p15-s08-main-ci
