    <radialGradient id="glow" cx="0.26" cy="0.2" r="0.78">
      <stop offset="0" stop-color="#2ab9d7" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2ab9d7" stop-opacity="0"/>
