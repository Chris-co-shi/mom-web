<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEO Manufacturing Platform</title>
    <script>
      (() => {
        const root = document.documentElement;
        let preference = 'light';
        try {
          const stored = window.localStorage.getItem('mom.theme.preference');
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            preference = stored;
          }
        } catch {
          preference = 'light';
        }
        const resolved =
          preference === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        root.setAttribute('theme-mode', resolved);
        root.dataset.themePreference = preference;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
